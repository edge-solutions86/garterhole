plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'io.github.rkaushikdev'
version = '1.0.0'
description = 'Method, composition, striking and tower tooling for change ringing bands'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.rkaushikdev.garterhole.cli.Main'
    applicationName = 'garterhole'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // picocli-codegen leaves annotations it does not claim, which -Xlint:processing reports.
    options.compilerArgs << '-Xlint:all' << '-Xlint:-processing'
}

tasks.named('compileJava') {
    options.compilerArgs << "-Aproject=${project.group}/${project.name}"
}

tasks.named('test') {
    useJUnitPlatform()
    // The tests read the repository's own files (sources, docs, changelog),
    // so they run from the project directory whatever the caller's directory.
    workingDir = projectDir
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

// The repository's own tooling, in io.github.rkaushikdev.garterhole.tools.
// Each runs from the project directory, because it reads or writes the
// repository's files.
def tool = { String name, String group, String description, String mainClassName, List<String> arguments ->
    tasks.register(name, JavaExec) {
        it.group = group
        it.description = description
        classpath = sourceSets.main.runtimeClasspath
        mainClass = "io.github.rkaushikdev.garterhole.tools.${mainClassName}"
        args arguments
        workingDir = projectDir
    }
}

tool('surface', 'documentation', 'Writes docs/surface.md from the routes, the commands and the settings.',
        'SurfaceDocument', [])
tool('surfaceCheck', 'verification', 'Fails when docs/surface.md is not what the code would write.',
        'SurfaceDocument', ['--check'])
tool('releaseCheck', 'verification', 'Fails when the build file, Version and the changelog disagree on the version.',
        'ReleaseCheck', [])
tool('smoke', 'verification', 'Starts the service on a free port and asks it a few questions.', 'Smoke', [])
tool('bench', 'verification', 'Times the slow parts: proving, falseness and the touch search.', 'Bench', [])

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification', 'surfaceCheck', 'releaseCheck'
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
